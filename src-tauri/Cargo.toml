[package]
name = "tunnel-dock"
version = "1.0.0"
description = "Local-first SSH port forwarding console"
authors = ["TunnelDock"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "tunnel_dock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
russh = "0.65"
async-trait = "0.1"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
open = "5"

[dev-dependencies]
tempfile = "3"
