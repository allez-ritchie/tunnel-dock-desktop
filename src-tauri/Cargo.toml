[package]
name = "tunnel-dock"
version = "1.0.0"
description = "Local-first SSH port forwarding console"
authors = ["TunnelDock"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "tunnel_dock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
# 导出 / 导入配置包时用到的原生文件选择框（保存、打开）。
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
russh = "0.65"
# russh 默认通过 aws-lc-rs 引入 aws-lc-sys。Windows x86-64 上 aws-lc-sys 编译汇编文件
# 需要 NASM 汇编器，否则构建脚本直接 panic（"NASM command not found! Build cannot continue."）。
# 这里显式打开 aws-lc-rs 的 prebuilt-nasm 特性，让 aws-lc-sys 在检测不到 NASM 时回退到
# crate 内置的预编译汇编对象，开发者无需额外安装 NASM；其他平台该特性不生效，
# 若环境里确实装了 NASM，仍会优先使用 NASM。
aws-lc-rs = { version = "1", default-features = false, features = ["prebuilt-nasm"] }
async-trait = "0.1"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
open = "5"
# 只导出/导入我们自己写的清单文件，因此只需要 deflate，不引入加密、zstd、lzma 等特性。
zip = { version = "7", default-features = false, features = ["deflate"] }
# 判断本机是否连接着局域网，用于“仅局域网可用”的隧道线路。
if-addrs = "0.15"

[dev-dependencies]
tempfile = "3"
